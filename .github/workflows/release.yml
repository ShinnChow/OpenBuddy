name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: OpenBuddy
  # Align with vendor/grok-build/bin/protoc (dotslash lockfile).
  PROTOC_VERSION: "29.3"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub-hosted runners; 22 is LTS.
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      # Avoid arduino/setup-protoc — it hits the GitHub Releases API and flakily
      # times out ("We couldn't respond to your request in time"). Download the
      # release asset directly with retries instead.
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          VER="${PROTOC_VERSION}"
          ASSET="protoc-${VER}-win64.zip"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${VER}/${ASSET}"
          DEST="${RUNNER_TEMP}/protoc"
          mkdir -p "$DEST"
          echo "Downloading ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 -o "${DEST}/${ASSET}" "$URL"; then
              break
            fi
            echo "download attempt $i failed; sleeping..."
            sleep $((i * 3))
            if [[ $i -eq 5 ]]; then
              echo "failed to download protoc after 5 attempts"
              exit 1
            fi
          done
          python - <<PY
          import zipfile, pathlib
          dest = pathlib.Path(r"""${DEST}""")
          z = dest / "${ASSET}"
          with zipfile.ZipFile(z) as zf:
              zf.extractall(dest)
          print("extracted to", dest)
          PY
          PROTOC_BIN="${DEST}/bin/protoc.exe"
          test -f "$PROTOC_BIN"
          echo "${DEST}/bin" >> "$GITHUB_PATH"
          echo "PROTOC=${PROTOC_BIN}" >> "$GITHUB_ENV"
          "$PROTOC_BIN" --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Apply grok-build patches
        shell: bash
        run: |
          cd vendor/grok-build
          for patch in ../../patches/grok-build/*.patch; do
            echo "Applying $patch ..."
            git apply --check "$patch" 2>/dev/null && git apply "$patch" || echo "  (already applied or skipped)"
          done

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app (NSIS)
        run: pnpm tauri build --bundles nsis
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc

      - name: List artifacts
        run: |
          ls src-tauri/target/release/bundle/nsis/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          VER="${PROTOC_VERSION}"
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|aarch64) PLATFORM="osx-aarch_64" ;;
            x86_64|amd64)  PLATFORM="osx-x86_64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          ASSET="protoc-${VER}-${PLATFORM}.zip"
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${VER}/${ASSET}"
          DEST="${RUNNER_TEMP}/protoc"
          mkdir -p "$DEST"
          echo "Downloading ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 -o "${DEST}/${ASSET}" "$URL"; then
              break
            fi
            echo "download attempt $i failed; sleeping..."
            sleep $((i * 3))
            if [[ $i -eq 5 ]]; then
              echo "failed to download protoc after 5 attempts"
              exit 1
            fi
          done
          unzip -qo "${DEST}/${ASSET}" -d "$DEST"
          PROTOC_BIN="${DEST}/bin/protoc"
          chmod +x "$PROTOC_BIN"
          test -x "$PROTOC_BIN"
          echo "${DEST}/bin" >> "$GITHUB_PATH"
          echo "PROTOC=${PROTOC_BIN}" >> "$GITHUB_ENV"
          "$PROTOC_BIN" --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Apply grok-build patches
        run: |
          cd vendor/grok-build
          for patch in ../../patches/grok-build/*.patch; do
            echo "Applying $patch ..."
            git apply --check "$patch" 2>/dev/null && git apply "$patch" || echo "  (already applied or skipped)"
          done

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Disable Windows-only rust-toolchain.toml
        run: mv rust-toolchain.toml rust-toolchain.toml.bak

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode and import the .p12 certificate into the macOS keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build Tauri app (DMG)
        run: pnpm tauri build --bundles dmg
        env:
          RUSTUP_TOOLCHAIN: stable
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Notarizing: $DMG_PATH"
          # Write the API key .p8 file
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > api_key.p8
          xcrun notarytool submit "$DMG_PATH" \
            --key api_key.p8 \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          # Staple the notarization ticket to the DMG
          xcrun stapler staple "$DMG_PATH"

      - name: List artifacts
        run: |
          ls src-tauri/target/release/bundle/dmg/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (CHANGELOG for release notes)
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 跑历史 tag 时也要取到该 tag 的 CHANGELOG。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          sparse-checkout: |
            CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      # 从 CHANGELOG.md 提取该 tag 的段落作为 Release 正文（用户可读的中文
      # 更新说明）。取不到时回退 GitHub 自动生成的提交列表，保证不为空。
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            # 取 "## vX.Y.Z" 标题行到下一个 "## " 之前的内容；
            # 去掉尾部分隔线（---）与空行。
            NOTES="$(awk -v ver="## ${TAG#v}" '
              $0 ~ "^## v" {
                if (found) exit
                if (index($0, ver) == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md | sed '/^---$/d' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [[ -n "$NOTES" ]]; then
              echo "$NOTES"
            else
              echo "（CHANGELOG.md 未包含 ${TAG} 段落，以下为自动生成的提交列表）"
              echo ""
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "=== Release body for ${TAG} ==="
          echo "$NOTES" | head -20

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          # 自动生成的提交列表会追加在 body 之后（Full Changelog）。
          generate_release_notes: true
          files: |
            artifacts/windows-nsis/*.exe
            artifacts/macos-dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
